[tool.poetry]
name = "video-to-subtitle"
version = "2.9.2"
description = "A local video-to-subtitle transcription tool based on faster-whisper"
authors = ["Yu-Han Cheng <kaoshou@gmail.com>"]

[project]
name = "video-to-subtitle"
version = "2.9.2"
dependencies = [
    "customtkinter",
    "tkinterdnd2",
    "faster-whisper",
    "opencc",
    "av>=11,<17",
    "pillow",
    "sounddevice",
    "psutil>=5.9,<8",
    "nvidia-ml-py>=12,<14; sys_platform != 'darwin'",
    "tomli; python_version < '3.11'"
]

[project.optional-dependencies]
mcp = ["mcp>=1.30,<2", "tomlkit>=0.13,<1"]
