name: File safety regression
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install av pillow customtkinter tkinterdnd2 numpy tqdm opencc
      - run: python -m unittest discover -s tests -v
        env:
          VTS_RUN_GUI_TESTS: '1'
  player:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix website ci
      - run: node --test tests/player/*.test.mjs
      - run: npm --prefix website test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install av
      - run: npm --prefix tests/browser ci
      - run: tests/browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Real Chromium transcript-follow geometry
        run: |
          python scripts/make_player_test_media.py "$RUNNER_TEMP/player-media/media.mp4"
          node scripts/smoke_player_browser.mjs --media "$RUNNER_TEMP/player-media/media.mp4" --report-dir "$RUNNER_TEMP/player-browser-report"
      - run: npm --prefix website run build
      - name: Real Chromium accessibility and reading downloads
        run: node scripts/smoke_accessibility_browser.mjs --media "$RUNNER_TEMP/player-media/media.mp4" --report-dir "$RUNNER_TEMP/player-accessibility-report" --site-dir website/dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Player-Accessibility-Validation-${{ github.workflow }}
          path: ${{ runner.temp }}/player-accessibility-report/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Player-Browser-Validation-${{ github.workflow }}
          path: ${{ runner.temp }}/player-browser-report/
          if-no-files-found: warn
