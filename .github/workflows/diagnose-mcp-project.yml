name: Diagnose Windows MCP project validation
on: workflow_dispatch
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "av>=11,<17" numpy tqdm opencc psutil
      - name: Repeat project-change regression with original exception diagnostics
        shell: pwsh
        run: |
          $env:PYTHONPATH = "tests;."
          for ($i = 0; $i -lt 20; $i++) {
            python -m unittest test_mcp_projects.ProjectPlayers.test_changed_project_during_build_is_never_published -v
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
