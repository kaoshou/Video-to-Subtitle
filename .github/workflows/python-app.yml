name: Build Cross-Platform Executables

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ "main" ]  # 當 main 分支有更新時觸發
  workflow_dispatch:      # 允許手動點擊按鈕觸發

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}  # 同時使用 Windows 與 Mac 環境進行編譯

    steps:
    - name: 檢出程式碼
      uses: actions/checkout@v4

    - name: 設定 Python 環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # 指定穩定支援最新 wheel 之 Python 版本

    - name: 安裝核心依賴套件
      run: |
        python -m pip install --upgrade pip
        pip install customtkinter tkinterdnd2 faster-whisper ctranslate2 opencc pyinstaller tomli av pillow sounddevice

    - name: 安裝 Mac 專屬依賴套件 (mlx-whisper)
      if: matrix.os == 'macos-latest'
      run: |
        pip install mlx-whisper

    - name: 執行編譯 (使用 .spec 檔)
      run: |
        pyinstaller VideoToSubtitle.spec

    - name: 注入與修補 MLX Metal Shader 函式庫 (macOS App Bundle)
      if: matrix.os == 'macos-latest'
      run: |
        echo "=== 正在定位 host Python 環境中的 mlx.metallib ==="
        METALLIB=$(python -c "
import os, sys, site
def find_lib():
    try:
        import mlx.core
        for cand in [os.path.join(os.path.dirname(os.path.abspath(mlx.core.__file__)), 'lib', 'mlx.metallib'),
                     os.path.join(os.path.dirname(os.path.abspath(mlx.core.__file__)), 'mlx.metallib')]:
            if os.path.exists(cand): return cand
    except Exception: pass
    try:
        import mlx
        d = os.path.dirname(os.path.abspath(mlx.__file__)) if (hasattr(mlx, '__file__') and mlx.__file__) else (list(mlx.__path__)[0] if hasattr(mlx, '__path__') else '')
        if d:
            for cand in [os.path.join(d, 'lib', 'mlx.metallib'), os.path.join(d, 'mlx.metallib')]:
                if os.path.exists(cand): return cand
    except Exception: pass
    for sp in site.getsitepackages():
        for root, _, files in os.walk(sp):
            if 'mlx.metallib' in files:
                return os.path.join(root, 'mlx.metallib')
    return ''
print(find_lib())
")
        echo "Python 模組搜尋 mlx.metallib 結果: $METALLIB"

        if [ -z "$METALLIB" ] || [ ! -f "$METALLIB" ]; then
          echo "⚠️ 嘗試透過系統全域 find 命令搜尋 mlx.metallib..."
          METALLIB=$(find /Users/runner -name "mlx.metallib" 2>/dev/null | head -n 1)
          echo "全域 find 結果: $METALLIB"
        fi

        if [ -z "$METALLIB" ] || [ ! -f "$METALLIB" ]; then
          echo "❌ 嚴重錯誤: 未能找到 mlx.metallib 實體檔案！"
          exit 1
        fi

        echo "✅ 成功鎖定 mlx.metallib 來源路徑: $METALLIB"

        APP_DIR="dist/VideoToSubtitle.app/Contents/MacOS"
        FW_DIR="dist/VideoToSubtitle.app/Contents/Frameworks"
        RES_DIR="dist/VideoToSubtitle.app/Contents/Resources"

        target_dirs=(
          "$APP_DIR"
          "$APP_DIR/Resources"
          "$APP_DIR/mlx"
          "$APP_DIR/mlx/lib"
          "$FW_DIR"
          "$FW_DIR/Resources"
          "$FW_DIR/mlx"
          "$FW_DIR/mlx/lib"
          "$RES_DIR"
        )

        for d in "${target_dirs[@]}"; do
          mkdir -p "$d"
          cp -f "$METALLIB" "$d/mlx.metallib"
          cp -f "$METALLIB" "$d/default.metallib"
          echo "已部署 metallib 至: $d"
        done

        echo "=== 驗證 App Bundle 內部 metallib 佈局 ==="
        find dist/VideoToSubtitle.app -name "*metallib"

    - name: 驗證 Mac App 與 MLX 模組完整性 (Smoke Test - 隔離主機環境測試)
      if: matrix.os == 'macos-latest'
      run: |
        echo "=== 正在隔離 host Python 環境中的 mlx 模組，模擬純淨 Mac 使用者系統 ==="
        HOST_MLX_DIR=$(python -c "
import os
try:
    import mlx.core
    print(os.path.dirname(os.path.abspath(mlx.core.__file__)))
except Exception:
    try:
        import mlx
        print(os.path.dirname(os.path.abspath(mlx.__file__)) if (hasattr(mlx, '__file__') and mlx.__file__) else (list(mlx.__path__)[0] if hasattr(mlx, '__path__') else ''))
    except Exception:
        print('')
")
        echo "Host MLX 目錄: $HOST_MLX_DIR"
        if [ -n "$HOST_MLX_DIR" ] && [ -d "$HOST_MLX_DIR" ]; then
          mv "$HOST_MLX_DIR" "${HOST_MLX_DIR}_backup"
        fi

        echo "=== 正在執行獨立 App Bundle 的 MLX Metal GPU 煙霧測試 ==="
        chmod +x dist/VideoToSubtitle.app/Contents/MacOS/VideoToSubtitle
        ./dist/VideoToSubtitle.app/Contents/MacOS/VideoToSubtitle --test-import-mlx

        echo "=== 測試通過！恢復 host Python 環境 ==="
        if [ -n "$HOST_MLX_DIR" ] && [ -d "${HOST_MLX_DIR}_backup" ]; then
          mv "${HOST_MLX_DIR}_backup" "$HOST_MLX_DIR"
        fi

    - name: 建立 Mac DMG 安裝檔 (含極限壓縮優化)
      if: matrix.os == 'macos-latest'
      run: |
        brew install create-dmg
        mkdir -p dist/dmg
        cp -r dist/VideoToSubtitle.app dist/dmg/
        create-dmg \
          --volname "VideoToSubtitle" \
          --window-pos 200 120 \
          --window-size 600 400 \
          --icon-size 100 \
          --icon "VideoToSubtitle.app" 150 190 \
          --hide-extension "VideoToSubtitle.app" \
          --app-drop-link 450 185 \
          "dist/VideoToSubtitle_raw.dmg" \
          "dist/dmg/"
        
        echo "=== 正在執行 DMG 系統級極限壓縮 (剔除空白磁區與二進位壓縮) ==="
        if hdiutil convert "dist/VideoToSubtitle_raw.dmg" -format ULMO -o "dist/VideoToSubtitle.dmg"; then
          echo "ULMO (LZMA) 壓縮完成！"
        else
          echo "降級至 UDZO (zlib level 9) 壓縮..."
          hdiutil convert "dist/VideoToSubtitle_raw.dmg" -format UDZO -imagekey zlib-level=9 -o "dist/VideoToSubtitle.dmg"
        fi
        rm -f "dist/VideoToSubtitle_raw.dmg"
        echo "=== 壓縮後最終 DMG 檔案清單與大小 ==="
        ls -lh "dist/VideoToSubtitle.dmg"

    - name: 上傳 Windows 成品 (Artifact)
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: VideoToSubtitle-Windows
        path: dist/VideoToSubtitle.exe  # Windows 產出的單一執行檔

    - name: 上傳 Mac 成品 (Artifact)
      if: matrix.os == 'macos-latest'
      uses: actions/upload-artifact@v4
      with:
        name: VideoToSubtitle-Mac
        path: dist/VideoToSubtitle.dmg  # Mac 產出的 DMG 安裝檔

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'  # 僅在推送到 main 時建立 Release
    permissions:
      contents: write  # 需要允許寫入以建立 Release
    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v4

      - name: 下載 Windows 成品
        uses: actions/download-artifact@v4
        with:
          name: VideoToSubtitle-Windows
          path: output-windows

      - name: 下載 Mac 成品
        uses: actions/download-artifact@v4
        with:
          name: VideoToSubtitle-Mac
          path: output-mac

      - name: 取得版本號
        id: get_version
        run: |
          VERSION=$(grep 'version =' pyproject.toml | head -n 1 | cut -d '"' -f 2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        shell: bash

      - name: 建立 Github Release 並上傳檔案
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: Release v${{ steps.get_version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            output-windows/VideoToSubtitle.exe
            output-mac/VideoToSubtitle.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
