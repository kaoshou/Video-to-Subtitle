name: Build Cross-Platform Executables

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ "main" ]  # 當 main 分支有更新時觸發
  workflow_dispatch:      # 允許手動點擊按鈕觸發

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}  # 同時使用 Windows 與 Mac 環境進行編譯

    steps:
    - name: 檢出程式碼
      uses: actions/checkout@v4

    - name: 設定 Python 環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.9' # 指定 Python 版本

    - name: 安裝核心依賴套件
      run: |
        python -m pip install --upgrade pip
        pip install customtkinter tkinterdnd2 faster-whisper ctranslate2 opencc pyinstaller tomli

    - name: 安裝 Mac 專屬依賴套件 (mlx-whisper)
      if: matrix.os == 'macos-latest'
      run: |
        pip install mlx-whisper

    - name: 執行編譯 (使用 .spec 檔)
      run: |
        pyinstaller VideoToSubtitle.spec

    - name: 建立 Mac DMG 安裝檔
      if: matrix.os == 'macos-latest'
      run: |
        brew install create-dmg
        mkdir -p dist/dmg
        cp -r dist/VideoToSubtitle.app dist/dmg/
        create-dmg \
          --volname "VideoToSubtitle" \
          --window-pos 200 120 \
          --window-size 600 400 \
          --icon-size 100 \
          --icon "VideoToSubtitle.app" 150 190 \
          --hide-extension "VideoToSubtitle.app" \
          --app-drop-link 450 185 \
          "dist/VideoToSubtitle.dmg" \
          "dist/dmg/"

    - name: 上傳 Windows 成品 (Artifact)
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: VideoToSubtitle-Windows
        path: dist/VideoToSubtitle.exe  # Windows 產出的單一執行檔

    - name: 上傳 Mac 成品 (Artifact)
      if: matrix.os == 'macos-latest'
      uses: actions/upload-artifact@v4
      with:
        name: VideoToSubtitle-Mac
        path: dist/VideoToSubtitle.dmg  # Mac 產出的 DMG 安裝檔

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'  # 僅在推送到 main 時建立 Release
    permissions:
      contents: write  # 需要允許寫入以建立 Release
    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v4

      - name: 下載 Windows 成品
        uses: actions/download-artifact@v4
        with:
          name: VideoToSubtitle-Windows
          path: output-windows

      - name: 下載 Mac 成品
        uses: actions/download-artifact@v4
        with:
          name: VideoToSubtitle-Mac
          path: output-mac

      - name: 取得版本號
        id: get_version
        run: |
          VERSION=$(grep 'version =' pyproject.toml | head -n 1 | cut -d '"' -f 2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        shell: bash

      - name: 建立 Github Release 並上傳檔案
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: Release v${{ steps.get_version.outputs.version }}
          draft: false
          prerelease: false
          files: |
            output-windows/VideoToSubtitle.exe
            output-mac/VideoToSubtitle.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
